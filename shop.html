<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - KidsMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: #f4f6f9;
        }
        
        .shop-header {
            background: linear-gradient(135deg, #f8b5c3 0%, #9ec5cb 100%);
            padding: 60px 0;
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid rgba(158, 197, 203, 0.2);
            margin-bottom: 30px;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(248, 181, 195, 0.15);
        }
        
        .product-image {
            height: 250px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }
        
        .product-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #f8b5c3;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1;
        }
        
        .btn-wishlist {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .btn-wishlist:hover {
            background: #f8b5c3;
            transform: scale(1.1);
        }
        
        .btn-wishlist.active {
            background: #f8b5c3;
            color: white;
        }
        
        .btn-wishlist svg {
            width: 20px;
            height: 20px;
        }
        
        .product-details {
            padding: 20px;
        }
        
        .product-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #f8b5c3;
            margin-bottom: 15px;
        }
        
        .original-price {
            font-size: 14px;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
        }
        
        .btn-add-cart {
            background: linear-gradient(135deg, #f8b5c3, #f9a5b5);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-add-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(248, 181, 195, 0.4);
        }
        
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>
  <script src="/js/kidsmart-common.js"></script>

    <div class="shop-header">
        <div class="container">
            <h1 class="display-4" style="font-family: 'Marcellus', serif;">Our Products</h1>
            <p class="lead">Discover our amazing collection for kids</p>
        </div>
    </div>

    <div class="container">
        <div class="row" id="productsContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    let wishlistProducts = new Set();
    let productsById = new Map();

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // =========================
    // Load Wishlist (SESSION BASED)
    // =========================
    async function loadWishlist() {
        try {
            const response = await fetch('/api/wishlist', {
                credentials: 'include'
            });

            if (response.ok) {
                const data = await response.json();
                const products = Array.isArray(data.products) ? data.products : [];
                wishlistProducts.clear();
                products.forEach(product => wishlistProducts.add(String(product._id)));
            }
        } catch (error) {
            console.error('Error loading wishlist:', error);
        }
    }

    // =========================
    // Add to Wishlist
    // =========================
    async function addToWishlist(productId) {
        try {
            const response = await fetch(`/api/wishlist/${encodeURIComponent(productId)}`, {
                method: 'POST',
                credentials: 'include'
            });

            if (response.status === 401) {
                showNotification('Please login first', 'warning');
                setTimeout(() => window.location.href = '/login.html', 1500);
                return;
            }

            const data = await response.json();
            if (response.ok && data.success) {
                wishlistProducts.add(String(productId));
                updateWishlistButtons();
                showNotification(data.message || 'Added to wishlist ❤️');
            } else {
                showNotification(data.message || 'Could not add to wishlist', 'error');
            }
        } catch (error) {
            console.error(error);
            showNotification('Server error', 'error');
        }
    }

    // =========================
    // Remove from Wishlist
    // =========================
    async function removeFromWishlist(productId) {
        try {
            const response = await fetch(`/api/wishlist/${encodeURIComponent(productId)}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok) {
                wishlistProducts.delete(String(productId));
                updateWishlistButtons();
                showNotification('Removed from wishlist');
            } else if (response.status === 401) {
                showNotification('Please login first', 'warning');
                setTimeout(() => window.location.href = '/login.html', 1500);
            }
        } catch (error) {
            console.error(error);
            showNotification('Server error', 'error');
        }
    }

    // =========================
    // Toggle Wishlist
    // =========================
    async function toggleWishlist(productId) {
        if (wishlistProducts.has(String(productId))) {
            await removeFromWishlist(productId);
        } else {
            await addToWishlist(productId);
        }
    }

    // =========================
    // Update Wishlist Buttons
    // =========================
    function updateWishlistButtons() {
        document.querySelectorAll('.btn-wishlist').forEach(btn => {
            const productId = btn.getAttribute('data-product-id');

            if (wishlistProducts.has(String(productId))) {
                btn.classList.add('active');
                btn.innerHTML = '❤️';
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '🤍';
            }
        });
    }

    // =========================
    // Notification
    // =========================
    function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.className = 'toast-notification';
        notification.style.background =
            type === 'error' ? '#dc3545' :
            type === 'warning' ? '#ffc107' : '#28a745';

        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 2000);
    }

    // =========================
    // Load Products
    // =========================
    async function loadProducts() {
        await loadWishlist();

        try {
            const response = await fetch('/api/products', {
                credentials: 'include'
            });

            const data = await response.json();
            const products = Array.isArray(data) ? data : (Array.isArray(data.products) ? data.products : []);
            productsById = new Map(products.map(product => [String(product._id), product]));

            const container = document.getElementById('productsContainer');

            if (!products || products.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><h3>No products found</h3></div>';
                return;
            }

            container.innerHTML = products.map(product => {
                const id = String(product._id);
                const image = product.images?.[0] || 'https://via.placeholder.com/250';
                const price = Number(product.price || 0).toLocaleString();
                const originalPrice = product.originalPrice ? `<span class="text-muted text-decoration-line-through ms-2">Rs ${Number(product.originalPrice).toLocaleString()}</span>` : '';
                return `
                <div class="col-md-4 col-lg-3">
                    <div class="product-card">
                        <div class="product-image">
                            ${product.isNewArrival ? '<span class="product-badge">New</span>' : ''}
                            <img src="${escapeHtml(image)}" alt="${escapeHtml(product.name)}">

                            <button class="btn-wishlist"
                                data-product-id="${id}"
                                onclick="toggleWishlist('${id}')">
                                🤍
                            </button>
                        </div>

                        <div class="product-details">
                            <h5 class="product-title">${escapeHtml(product.name)}</h5>

                            <div class="product-price">
                                Rs ${price}${originalPrice}
                            </div>

                            <button class="btn-add-cart" onclick="addToCart('${id}')">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');

            updateWishlistButtons();
            updateCartCount();

        } catch (error) {
            console.error(error);
            document.getElementById('productsContainer').innerHTML =
                '<div class="col-12 text-center"><h3>Error loading products</h3></div>';
        }
    }

    // =========================
    // Cart
    // =========================
    function addToCart(productId) {
        const product = productsById.get(String(productId));
        if (!product) return;

        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const existingItem = cart.find(item => String(item.id) === String(productId));

        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({
                id: String(product._id),
                name: product.name,
                price: Number(product.price || 0),
                quantity: 1,
                image: product.images?.[0] || ''
            });
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        showNotification('Added to cart 🛒');
    }

    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const total = cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        document.querySelectorAll('.cart-count').forEach(el => el.textContent = `(${total})`);
    }

    // =========================
    // Init
    // =========================
    document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
