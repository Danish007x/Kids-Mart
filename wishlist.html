<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - KidsMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: #f4f6f9;
        }

        .wishlist-header {
            background: linear-gradient(135deg, #f8b5c3 0%, #9ec5cb 100%);
            padding: 60px 0;
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

        .wishlist-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid rgba(158, 197, 203, 0.2);
            margin-bottom: 30px;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(248, 181, 195, 0.15);
        }

        .product-image {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 20px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #f8b5c3;
        }

        .btn-add-cart {
            background: linear-gradient(135deg, #f8b5c3, #f9a5b5);
            border: none;
            padding: 10px;
            border-radius: 25px;
            color: white;
            width: 100%;
        }

        .btn-remove {
            background: #dc3545;
            border: none;
            padding: 8px;
            border-radius: 20px;
            color: white;
            width: 100%;
        }

        .empty-wishlist {
            text-align: center;
            padding: 60px 20px;
        }

        .btn-shop {
            background: linear-gradient(135deg, #f8b5c3, #f9a5b5);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="nav-placeholder"></div>
  <script src="/js/kidsmart-common.js"></script>

<div class="wishlist-header">
    <div class="container">
        <h1 class="display-4" style="font-family: 'Marcellus', serif;">My Wishlist ❤️</h1>
        <p class="lead">Products you've saved for later</p>
    </div>
</div>

<div class="container">
    <div class="wishlist-container">
        <div id="wishlistProducts">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </div>
</div>

<script>
let wishlistProductsById = new Map();

async function verifyAuth() {
    try {
        const res = await fetch('/api/me', {
            method: 'GET',
            credentials: 'include'
        });

        if (!res.ok) {
            window.location.href = '/login.html';
            return false;
        }

        return true;
    } catch (err) {
        console.error(err);
        window.location.href = '/login.html';
        return false;
    }
}

function showNotification(msg, type='success') {
    const div = document.createElement('div');
    div.className = 'toast-notification';
    div.style.background =
        type === 'success' ? '#28a745' :
        type === 'error' ? '#dc3545' : '#17a2b8';

    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2000);
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

async function loadWishlist() {
    try {
        const response = await fetch('/api/wishlist', {
            method: 'GET',
            credentials: 'include'
        });

        if (response.status === 401) {
            window.location.href = '/login.html';
            return;
        }

        const data = await response.json();
        const products = Array.isArray(data.products) ? data.products : [];
        console.log(products)
        wishlistProductsById = new Map(products.map(product => [String(product._id), product]));

        const container = document.getElementById('wishlistProducts');

        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-wishlist">
                    <h3>Your wishlist is empty</h3>
                    <p>Start adding items you love ❤️</p>
                    <a href="/shop.html" class="btn-shop">Continue Shopping</a>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="row">
                ${products.map(p => {
                    const id = String(p._id);
                    const image = p.images?.[0] || 'https://via.placeholder.com/200';
                    return `
                    <div class="col-md-4 col-lg-3">
                        <div class="product-card">
                            <div class="product-image">
                                <img src="${escapeHtml(image)}" alt="${escapeHtml(p.name)}">
                            </div>
                            <div class="product-details">
                                <div class="product-title">${escapeHtml(p.name)}</div>
                                <div class="product-price">Rs ${Number(p.price || 0).toLocaleString()}</div>

                                <button class="btn-add-cart" onclick="addToCart('${id}')">
                                    Add to Cart
                                </button>

                                <button class="btn-remove" onclick="removeFromWishlist('${id}')">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `}).join('')}
            </div>
        `;

    } catch (err) {
        console.error('Error loading wishlist:', err);
        document.getElementById('wishlistProducts').innerHTML =
            `<div class="text-center">Error loading wishlist</div>`;
    }
}

function addToCart(id) {
    const product = wishlistProductsById.get(String(id));
    if (!product) return;

    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const item = cart.find(i => String(i.id) === String(id));

    if (item) {
        item.quantity++;
    } else {
        cart.push({
            id: String(product._id),
            name: product.name,
            price: Number(product.price || 0),
            quantity: 1,
            image: product.images?.[0] || ''
        });
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    showNotification('Added to cart 🛒');
    updateCartCount();
}

async function removeFromWishlist(id) {
    if (!confirm('Remove this item?')) return;

    try {
        const res = await fetch(`/api/wishlist/${encodeURIComponent(id)}`, {
            method: 'DELETE',
            credentials: 'include'
        });

        if (res.status === 401) {
            window.location.href = '/login.html';
            return;
        }

        if (res.ok) {
            showNotification('Removed from wishlist', 'info');
            loadWishlist();
        } else {
            showNotification('Failed to remove', 'error');
        }
    } catch (err) {
        console.error(err);
        showNotification('Server error', 'error');
    }
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const total = cart.reduce((a, b) => a + Number(b.quantity || 0), 0);

    document.querySelectorAll('.cart-count')
        .forEach(el => el.textContent = `(${total})`);
}

document.addEventListener('DOMContentLoaded', async () => {
    updateCartCount();
    const ok = await verifyAuth();
    if (ok) loadWishlist();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
