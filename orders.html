<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - KidsMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: #f4f6f9;
        }
        .orders-header {
            background: linear-gradient(135deg, #f8b5c3 0%, #9ec5cb 100%);
            padding: 60px 0 40px;
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }
        .order-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(158, 197, 203, 0.15);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .order-id {
            font-weight: 700;
            color: #2c3e50;
            font-size: 15px;
        }
        .order-date {
            font-size: 13px;
            color: #888;
        }
        .status-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .order-body {
            padding: 20px 24px;
        }
        .order-product-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f8f9fa;
        }
        .order-product-row:last-child {
            border-bottom: none;
        }
        .order-product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            background: #f8f9fa;
            flex-shrink: 0;
        }
        .order-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: linear-gradient(135deg, rgba(248,181,195,0.08) 0%, rgba(158,197,203,0.08) 100%);
            border-top: 1px solid #f0f0f0;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 16px;
        }
    </style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="/js/kidsmart-common.js"></script>

<div class="orders-header">
    <div class="container">
        <h1 style="font-family:'Marcellus',serif;margin-bottom:6px;">My Orders</h1>
        <p style="opacity:0.9;margin:0;">Track and view your past orders</p>
    </div>
</div>

<div class="container pb-5" style="max-width:800px;">
    <div id="ordersContainer">
        <div class="text-center py-5">
            <div class="spinner-border" style="color:#f8b5c3;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</div>

<script>
function escapeHtml(val) {
    return String(val ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-PK', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function loadOrders() {
    const container = document.getElementById('ordersContainer');

    try {
        const meRes = await fetch('/api/me', { credentials: 'include' });
        if (!meRes.ok) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size:56px;margin-bottom:16px;">🔒</div>
                    <h3 style="font-family:'Marcellus',serif;color:#2c3e50;">Please Log In</h3>
                    <p class="text-muted">You need to be logged in to view your orders.</p>
                    <a href="/login.html" class="btn mt-3" style="background:linear-gradient(135deg,#f8b5c3,#9ec5cb);border:none;color:white;border-radius:25px;padding:12px 32px;font-weight:600;">Login</a>
                </div>`;
            return;
        }

        const meData = await meRes.json();
        const email = meData?.user?.email;

        const res = await fetch(`/api/orders/customer/${encodeURIComponent(email)}`, { credentials: 'include' });
        const data = await res.json();
        const orders = data?.orders || [];

        if (!orders.length) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size:56px;margin-bottom:16px;">📦</div>
                    <h3 style="font-family:'Marcellus',serif;color:#2c3e50;">No Orders Yet</h3>
                    <p class="text-muted">You haven't placed any orders yet. Start shopping!</p>
                    <a href="/shop.html" class="btn mt-3" style="background:linear-gradient(135deg,#f8b5c3,#9ec5cb);border:none;color:white;border-radius:25px;padding:12px 32px;font-weight:600;">Shop Now</a>
                </div>`;
            return;
        }

        container.innerHTML = orders.map(order => {
            const statusClass = `status-${order.status || 'pending'}`;
            const products = Array.isArray(order.products) ? order.products : [];
            return `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">${escapeHtml(order.orderId || order._id)}</div>
                            <div class="order-date">${formatDate(order.createdAt)}</div>
                        </div>
                        <span class="status-badge ${statusClass}">${escapeHtml(order.status || 'pending')}</span>
                    </div>
                    <div class="order-body">
                        ${products.length ? products.map(p => `
                            <div class="order-product-row">
                                <div style="width:50px;height:50px;background:#f8f9fa;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">👕</div>
                                <div style="flex:1;min-width:0;">
                                    <div style="font-weight:600;font-size:14px;color:#2c3e50;">${escapeHtml(p.name || 'Product')}</div>
                                    <div style="font-size:13px;color:#888;">Qty: ${Number(p.quantity || 1)}</div>
                                </div>
                                <div style="font-weight:700;color:#f8b5c3;font-size:14px;white-space:nowrap;">Rs ${(Number(p.price||0)*Number(p.quantity||1)).toLocaleString()}</div>
                            </div>`).join('') : '<p class="text-muted" style="font-size:14px;margin:0;">No product details</p>'}
                    </div>
                    <div class="order-total-row">
                        <span class="text-muted">Shipping: ${order.shippingAddress ? `<span style="color:#2c3e50;font-weight:500;">${escapeHtml(order.shippingAddress)}</span>` : 'N/A'}</span>
                        <span style="font-weight:700;font-size:16px;color:#2c3e50;">Total: Rs ${Number(order.total || 0).toLocaleString()}</span>
                    </div>
                </div>`;
        }).join('');
    } catch (err) {
        container.innerHTML = `
            <div class="empty-state">
                <div style="font-size:56px;margin-bottom:16px;">⚠️</div>
                <h3 style="font-family:'Marcellus',serif;color:#2c3e50;">Could Not Load Orders</h3>
                <p class="text-muted">There was a problem loading your orders. Please try again.</p>
                <button class="btn mt-3" style="background:linear-gradient(135deg,#f8b5c3,#9ec5cb);border:none;color:white;border-radius:25px;padding:12px 32px;font-weight:600;" onclick="loadOrders()">Retry</button>
            </div>`;
    }
}

document.addEventListener('DOMContentLoaded', loadOrders);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
