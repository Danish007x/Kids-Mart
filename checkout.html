<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - KidsMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: #f4f6f9;
        }

        .checkout-header {
            background: linear-gradient(135deg, #f8b5c3 0%, #9ec5cb 100%);
            padding: 60px 0 40px;
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

        .checkout-card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }

        .section-title {
            font-family: 'Marcellus', serif;
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f8b5c3;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            font-family: 'Jost', sans-serif;
        }

        .form-control:focus, .form-select:focus {
            border-color: #f8b5c3;
            box-shadow: 0 0 0 0.2rem rgba(248, 181, 195, 0.25);
        }

        .form-label {
            font-weight: 500;
            color: #444;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .order-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            background: #f8f9fa;
            flex-shrink: 0;
        }

        .order-item-placeholder {
            width: 60px;
            height: 60px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .order-summary-total {
            background: linear-gradient(135deg, #f8b5c3 0%, #9ec5cb 100%);
            border-radius: 12px;
            padding: 20px;
            color: white;
        }

        .btn-place-order {
            background: linear-gradient(135deg, #f8b5c3, #f9a5b5);
            border: none;
            padding: 16px;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-place-order:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(248, 181, 195, 0.5);
            color: white;
        }

        .btn-place-order:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .empty-cart-message {
            text-align: center;
            padding: 60px 20px;
        }

        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #f8b5c3, #9ec5cb);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 14px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .section-title-row {
            display: flex;
            align-items: center;
        }

        .success-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .success-overlay.active {
            display: flex;
        }

        .success-box {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .success-title {
            font-family: 'Marcellus', serif;
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .btn-continue {
            background: linear-gradient(135deg, #f8b5c3, #9ec5cb);
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            margin-top: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(248, 181, 195, 0.4);
        }

        @media (max-width: 768px) {
            .checkout-header {
                padding: 80px 0 30px;
            }
        }
    </style>
</head>
<body>

<div id="nav-placeholder"></div>
<script src="/js/kidsmart-common.js"></script>

<div class="checkout-header">
    <div class="container">
        <h1 style="font-family: 'Marcellus', serif; margin-bottom: 6px;">Checkout</h1>
        <p style="opacity: 0.9; margin: 0;">Almost there! Fill in your details to place your order</p>
    </div>
</div>

<div class="container pb-5" id="checkoutContainer">
    <!-- Rendered by JS -->
</div>

<!-- Order Success Overlay -->
<div class="success-overlay" id="successOverlay">
    <div class="success-box">
        <div class="success-icon">🎉</div>
        <div class="success-title">Order Placed!</div>
        <p class="text-muted" id="successOrderId" style="margin-bottom: 4px;"></p>
        <p class="text-muted" style="font-size: 14px;">Thank you for shopping with KidsMart. Your order has been received and will be processed shortly.</p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <button class="btn-continue" onclick="window.location.href='/shop.html'">Continue Shopping</button>
            <button class="btn-continue" style="background: linear-gradient(135deg, #9ec5cb, #7badb5);" onclick="window.location.href='/orders.html'">My Orders</button>
        </div>
    </div>
</div>

<script>
function escapeHtml(val) {
    return String(val ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCheckout() {
    const cart = KidsMart.getCart();
    const container = document.getElementById('checkoutContainer');

    if (!cart || cart.length === 0) {
        container.innerHTML = `
            <div class="checkout-card empty-cart-message">
                <div style="font-size:64px;margin-bottom:16px;">🛒</div>
                <h3 style="font-family:'Marcellus',serif;color:#2c3e50;">Your cart is empty</h3>
                <p class="text-muted">Add some products before checking out.</p>
                <a href="/shop.html" class="btn mt-3" style="background:linear-gradient(135deg,#f8b5c3,#9ec5cb);border:none;color:white;border-radius:25px;padding:12px 32px;font-weight:600;">Browse Shop</a>
            </div>`;
        return;
    }

    const subtotal = cart.reduce((s, item) => s + (Number(item.price || 0) * Number(item.quantity || 0)), 0);
    const shipping = subtotal >= 2000 ? 0 : 150;
    const total = subtotal + shipping;

    container.innerHTML = `
        <div class="row g-4">
            <div class="col-lg-7">
                <!-- Contact Info -->
                <div class="checkout-card">
                    <div class="section-title-row">
                        <span class="step-badge">1</span>
                        <h2 class="section-title mb-0 border-0 pb-0" style="flex:1;border-bottom:none;">Contact Information</h2>
                    </div>
                    <hr style="border-color:#f8b5c3;margin-top:12px;margin-bottom:20px;">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="customerName" placeholder="Your full name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="customerEmail" placeholder="your@email.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" class="form-control" id="customerPhone" placeholder="e.g. 03001234567" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">City *</label>
                            <input type="text" class="form-control" id="customerCity" placeholder="Your city" required>
                        </div>
                    </div>
                </div>

                <!-- Shipping Address -->
                <div class="checkout-card">
                    <div class="section-title-row">
                        <span class="step-badge">2</span>
                        <h2 class="section-title mb-0 border-0 pb-0" style="flex:1;border-bottom:none;">Delivery Address</h2>
                    </div>
                    <hr style="border-color:#f8b5c3;margin-top:12px;margin-bottom:20px;">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Street Address *</label>
                            <input type="text" class="form-control" id="addressStreet" placeholder="House/Flat no., Street name, Area" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Province</label>
                            <select class="form-select" id="addressProvince">
                                <option value="">Select Province</option>
                                <option>Punjab</option>
                                <option>Sindh</option>
                                <option>KPK</option>
                                <option>Balochistan</option>
                                <option>Islamabad (Capital Territory)</option>
                                <option>Azad Kashmir</option>
                                <option>Gilgit-Baltistan</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Postal Code</label>
                            <input type="text" class="form-control" id="addressPostal" placeholder="e.g. 54000">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Order Notes (Optional)</label>
                            <textarea class="form-control" id="orderNotes" rows="2" placeholder="Any special instructions for delivery..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="checkout-card">
                    <div class="section-title-row">
                        <span class="step-badge">3</span>
                        <h2 class="section-title mb-0 border-0 pb-0" style="flex:1;border-bottom:none;">Payment Method</h2>
                    </div>
                    <hr style="border-color:#f8b5c3;margin-top:12px;margin-bottom:20px;">
                    <div class="d-flex flex-column gap-3">
                        <label class="d-flex align-items-center gap-3 p-3 rounded-3 cursor-pointer" style="border:2px solid #f8b5c3;background:#fff9fb;cursor:pointer;">
                            <input type="radio" name="paymentMethod" value="cod" checked style="accent-color:#f8b5c3;width:18px;height:18px;">
                            <div>
                                <div style="font-weight:600;color:#2c3e50;">Cash on Delivery</div>
                                <div style="font-size:13px;color:#888;">Pay when you receive your order</div>
                            </div>
                            <span style="margin-left:auto;font-size:22px;">💵</span>
                        </label>
                        <label class="d-flex align-items-center gap-3 p-3 rounded-3" style="border:2px solid #e0e0e0;background:#fafafa;cursor:pointer;opacity:0.6;" title="Coming soon">
                            <input type="radio" name="paymentMethod" value="card" disabled style="width:18px;height:18px;">
                            <div>
                                <div style="font-weight:600;color:#2c3e50;">Card Payment <span style="font-size:12px;color:#f8b5c3;">(Coming Soon)</span></div>
                                <div style="font-size:13px;color:#888;">Pay securely with your card</div>
                            </div>
                            <span style="margin-left:auto;font-size:22px;">💳</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <!-- Order Summary -->
                <div class="checkout-card" style="position:sticky;top:80px;">
                    <div class="section-title-row">
                        <span class="step-badge">✓</span>
                        <h2 class="section-title mb-0 border-0 pb-0" style="flex:1;border-bottom:none;">Order Summary</h2>
                    </div>
                    <hr style="border-color:#f8b5c3;margin-top:12px;margin-bottom:4px;">

                    <div id="orderItemsList">
                        ${cart.map(item => `
                            <div class="order-item">
                                ${item.image
                                    ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}" onerror="this.style.display='none'">`
                                    : `<div class="order-item-placeholder">👕</div>`}
                                <div style="flex:1;min-width:0;">
                                    <div style="font-size:14px;font-weight:600;color:#2c3e50;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.name)}</div>
                                    <div style="font-size:13px;color:#888;">Qty: ${Number(item.quantity)}</div>
                                </div>
                                <div style="font-size:14px;font-weight:700;color:#f8b5c3;white-space:nowrap;">Rs ${(Number(item.price || 0) * Number(item.quantity || 0)).toLocaleString()}</div>
                            </div>`).join('')}
                    </div>

                    <div class="mt-3 pt-2">
                        <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid #f0f0f0;">
                            <span class="text-muted">Subtotal</span>
                            <span style="font-weight:600;">Rs ${subtotal.toLocaleString()}</span>
                        </div>
                        <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid #f0f0f0;">
                            <span class="text-muted">Shipping</span>
                            <span style="font-weight:600;color:${shipping === 0 ? '#28a745' : '#2c3e50'};">
                                ${shipping === 0 ? 'FREE' : `Rs ${shipping.toLocaleString()}`}
                            </span>
                        </div>
                        ${shipping > 0 ? `<div class="text-muted py-1" style="font-size:12px;">Free shipping on orders above Rs 2,000</div>` : ''}
                    </div>

                    <div class="order-summary-total mt-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span style="font-size:18px;font-weight:600;">Total</span>
                            <span style="font-size:22px;font-weight:700;">Rs ${total.toLocaleString()}</span>
                        </div>
                        <div style="font-size:12px;opacity:0.85;margin-top:4px;">${cart.length} item${cart.length !== 1 ? 's' : ''} · Cash on Delivery</div>
                    </div>

                    <button class="btn-place-order mt-4" id="placeOrderBtn" onclick="placeOrder()">
                        Place Order →
                    </button>

                    <div id="orderError" class="alert alert-danger mt-3" style="display:none;border-radius:10px;font-size:14px;"></div>

                    <button class="btn btn-link w-100 mt-2 text-muted" style="font-size:13px;text-decoration:none;" onclick="history.back()">
                        ← Back to Cart
                    </button>
                </div>
            </div>
        </div>`;
}

async function placeOrder() {
    const name = document.getElementById('customerName')?.value?.trim();
    const email = document.getElementById('customerEmail')?.value?.trim();
    const phone = document.getElementById('customerPhone')?.value?.trim();
    const city = document.getElementById('customerCity')?.value?.trim();
    const street = document.getElementById('addressStreet')?.value?.trim();
    const province = document.getElementById('addressProvince')?.value?.trim();
    const postal = document.getElementById('addressPostal')?.value?.trim();
    const notes = document.getElementById('orderNotes')?.value?.trim();
    const errorEl = document.getElementById('orderError');
    const btn = document.getElementById('placeOrderBtn');

    if (errorEl) errorEl.style.display = 'none';

    if (!name) { showError('Please enter your full name.'); return; }
    if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return; }
    if (!phone) { showError('Please enter your phone number.'); return; }
    if (!city) { showError('Please enter your city.'); return; }
    if (!street) { showError('Please enter your delivery address.'); return; }

    const cart = KidsMart.getCart();
    if (!cart || cart.length === 0) { showError('Your cart is empty.'); return; }

    const subtotal = cart.reduce((s, item) => s + (Number(item.price || 0) * Number(item.quantity || 0)), 0);
    const shipping = subtotal >= 2000 ? 0 : 150;
    const total = subtotal + shipping;

    const addressLine = [street, city, province, postal].filter(Boolean).join(', ');

    const orderData = {
        customer: name,
        customerEmail: email,
        customerPhone: phone,
        shippingAddress: addressLine,
        notes: notes || '',
        products: cart.map(item => ({
            productId: String(item.id || ''),
            name: String(item.name || ''),
            quantity: Number(item.quantity || 1),
            price: Number(item.price || 0)
        })),
        total: total,
        status: 'pending'
    };

    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Placing Order...';
    }

    try {
        const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(orderData)
        });

        const data = await res.json();

        if (res.ok && data.success) {
            KidsMart.saveCart([]);
            KidsMart.updateCartCount();
            const successOrderId = document.getElementById('successOrderId');
            if (successOrderId) successOrderId.textContent = `Order ID: ${data.order?.orderId || data.order?._id || 'Confirmed'}`;
            document.getElementById('successOverlay').classList.add('active');
        } else {
            showError(data.message || 'Could not place your order. Please try again.');
            if (btn) { btn.disabled = false; btn.textContent = 'Place Order →'; }
        }
    } catch (err) {
        showError('Network error. Please check your connection and try again.');
        if (btn) { btn.disabled = false; btn.textContent = 'Place Order →'; }
    }
}

function showError(msg) {
    const el = document.getElementById('orderError');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', renderCheckout);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Checkout Modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background: linear-gradient(135deg, #f8b5c3, #9ec5cb);">
        <h5 class="modal-title text-white" id="checkoutModalLabel">🧾 Checkout</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="checkoutForm">
          <div class="mb-3">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" name="name" required placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" name="phone" required placeholder="03XX-XXXXXXX">
          </div>
          <div class="mb-3">
            <label class="form-label">Shipping Address *</label>
            <textarea class="form-control" name="address" rows="2" required placeholder="House, street, city..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Method *</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="paymentMethod" value="cod" id="codOption" checked>
              <label class="form-check-label" for="codOption">Cash on Delivery</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="paymentMethod" value="card" id="cardOption"
                style="width:18px; height:18px;">
              <label class="form-check-label" for="cardOption">Credit / Debit Card</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Order Notes (optional)</label>
            <textarea class="form-control" name="notes" rows="1"></textarea>
          </div>
        </form>
        <div class="cart-summary border-top pt-2 mt-2">
          <div class="d-flex justify-content-between fw-bold">
            <span>Total Amount:</span>
            <span id="checkoutModalTotal" style="color: #f8b5c3;">Rs 0</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn" id="placeOrderBtn"
          style="background: linear-gradient(135deg, #f8b5c3, #f9a5b5); border: none; color: white; font-weight: 600;">
          Place Order
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
