<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KidsMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Marcellus&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: linear-gradient(135deg, #f8b5c3 0%, #9ec5cb 100%);
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        .btn-login {
            background: linear-gradient(135deg, #f8b5c3, #f9a5b5);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(248, 181, 195, 0.4);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-control:focus {
            border-color: #f8b5c3;
            box-shadow: 0 0 0 0.2rem rgba(248, 181, 195, 0.25);
        }
    </style>
</head>

<body class="d-flex align-items-center">

    <!-- Navigation -->
    <div id="nav-placeholder"></div>
  <script src="/js/kidsmart-common.js"></script>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card mx-auto">

                    <div class="text-center mb-4">
                        <h1 class="display-6" style="font-family: 'Marcellus', serif;">
                            Kids<span style="color: #f8b5c3;">Mart</span>
                        </h1>
                        <p class="text-muted">Welcome back! Please login to your account</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <button type="submit" class="btn btn-login btn-primary w-100 mb-3">
                            Login
                        </button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">
                            Don't have an account?
                            <a href="/register.html" style="color: #f8b5c3;">Register here</a>
                        </p>
                        <a href="/" class="text-muted text-decoration-none mt-2 d-inline-block">
                            ← Back to Home
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Login script -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;

            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('Login successful!');
                    window.location.href = '/';
                } else {
                    alert(data.message || 'Login failed');
                }
            } catch (error) {
                console.error(error);
                alert('Error connecting to server. Make sure the backend is running.');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
